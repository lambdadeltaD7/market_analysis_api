<!DOCTYPE html>

<html>

<head>
    <title> Web version of API </title>

    <link rel="icon" href="../img/icon3.jpg">

    <link rel="stylesheet" href="../css/cool.css">

    <script src="../js/index.js" defer></script>
</head>


<body>
    <!-- navigation between instances -->
    <header>
        <div class="map-section">
            <p>Instances: </p>
            <a id="loc_things" class="other_page" href="/things">things</a>
            <a id="loc_users" class="other_page" href="/users">users</a>
        </div>
    </header>

    <main class="main-content">
        <button class="update-btn" onclick="loadAllSummaries()">update_summary</button>
        <div class="summary-grid">
            <div class="summary-card" id="users-summary">
                <h2>Users</h2>
                <p>Loading...</p>
            </div>
            <div class="summary-card" id="things-summary">
                <h2>Things</h2>
                <p>Loading...</p>
            </div>
            <div class="summary-card" id="sales-summary">
                <h2>Sales</h2>
                <p>Loading...</p>
            </div>
        </div>
        <div class="gif-container">
            <img id="random-gif" src="" alt="fun gif">
        </div>
    </main>

    <footer>
        <div class="cool-footer">
            <div style="display: flex; flex-direction: column;">
            <p>row 1 col 1</p>
            <p>row 2 col 1</p>
            </div>

            <div style="display: flex; flex-direction: column;">
            <p>row 1 col 2</p>
            <p>row 2 col 2</p>
            </div>
        </div>
    </footer>

</body>

</html>
