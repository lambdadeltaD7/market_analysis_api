
services:
  db_cluster:
    build: ./src/backend/db_cluster
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 8002:5432

  main_app:
    build: ./src/backend/main_app
    env_file:
      - .env
    ports:
      - 8001:8080