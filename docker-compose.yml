
services:
  db_cluster:
    build: ./src/backend/db_cluster
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 8002:5432

  main_app:
    build: ./src/backend/main_app
    env_file:
      - .env
    ports:
      - 8001:8080
    depends_on:
      - db_cluster

  nginx_app:
    build: ./src/backend/nginx_app
    env_file:
      - .env
    ports:
      - 8003:80
    volumes:
      - ./src/frontend/html:/usr/share/nginx/static/html:ro
      - ./src/frontend/css:/usr/share/nginx/static/css:ro
      - ./src/frontend/js:/usr/share/nginx/static/js:ro
      - ./src/frontend/img:/usr/share/nginx/static/img:ro
    depends_on:
      - db_cluster
      - main_app